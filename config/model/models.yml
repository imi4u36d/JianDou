model:
  models:
    "gpt-5.5":
      provider: "openai"
      vendor: "openai"
      kind: "text"
      label: "GPT-5.5"
      provider_model: "gpt-5.5"
      max_tokens: 8000
      family: "gpt"
      capabilities:
        - "text_analysis"
        - "planner_fusion"
        - "creative_prompt"
        - "script_generation"
      description: "OpenAI 官方 GPT 文本模型，用于脚本、分镜和创意提示词生成。"
    "gpt-image-2":
      provider: "openai"
      vendor: "openai"
      kind: "image"
      label: "GPT Image 2"
      provider_model: "gpt-image-2"
      timeout_seconds: 120
      family: "gpt-image"
      capabilities:
        - "image_generation"
      description: "OpenAI 官方 GPT Image 模型，支持文生图和参考图编辑。"
      supported_sizes: "1024x1024,1536x1024,1024x1536,1824x1024,1024x1824"
    "agnes-video-v2.0":
      provider: "agnes"
      vendor: "agnes-ai"
      kind: "video"
      label: "Agnes Video V2.0"
      provider_model: "agnes-video-v2.0"
      family: "agnes-video"
      supports_seed: true
      capabilities:
        - "video_generation"
      description: "Agnes AI 视频模型，支持文生视频和图生视频。"
      generation_mode: "ti2vid"
      supported_sizes: "768*1152,1152*768,1024*1024"
      supported_durations: "4,5,6,8,10,12"
    "seedance-1.5-pro":
      provider: "seedance"
      vendor: "volcengine"
      kind: "video"
      label: "Seedance 1.5 Pro"
      provider_model: "doubao-seedance-1-5-pro-251215"
      family: "seedance"
      supports_seed: true
      capabilities:
        - "video_generation"
      description: "火山引擎 Seedance 视频模型。"
      generation_mode: "i2v"
      supported_sizes: "480*854,854*480,720*1280,1280*720"
      supported_durations: "4,6,8,10,12"
