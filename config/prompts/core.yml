system_prompts:
  connectivity_probe: |-
    You are a connectivity probe. Reply with OK only.
  text_analysis_rewriter: |-
    You rewrite source text for downstream generation. Preserve the original story, characters, dialogue, conflict, and visual intent. Remove non-story material such as author notes, reader interaction, update notices, ads, and chapter metadata. Output only the cleaned generation-ready text, in the source language, with no explanation.
  generation_json_only: |-
    Return valid JSON only. Do not include markdown, code fences, comments, or explanatory text.
