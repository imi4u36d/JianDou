name: jiandou

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiandou-app
    restart: unless-stopped
    ports:
      - "${JIANDOU_PORT:-80}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./storage:/app/storage
    environment:
      JIANDOU_APP_ENV: ${JIANDOU_APP_ENV:-dev}
      JIANDOU_SQLITE_PATH: ${JIANDOU_SQLITE_PATH:-/app/data/jiandou.db}
      JIANDOU_SECRET_KEY: ${JIANDOU_SECRET_KEY:-change-me}
      JIANDOU_STORAGE_ROOT: ${JIANDOU_STORAGE_ROOT:-/app/storage}
      JIANDOU_CONFIG_DIR: ${JIANDOU_CONFIG_DIR:-/app/config}
