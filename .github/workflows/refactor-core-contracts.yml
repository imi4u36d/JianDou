name: Refactor core frontend contracts

on:
  push:
    branches:
      - refactor/extract-core-contracts

permissions:
  contents: write

jobs:
  extract-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/extract-core-contracts
          fetch-depth: 0

      - name: Extract core contract definitions
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          TYPES_DIR = Path("frontends/web/src/types")
          INDEX_PATH = TYPES_DIR / "index.ts"

          groups = {
              "auth": [
                  "UserRole",
                  "UserStatus",
                  "InviteStatus",
                  "AuthenticatedUser",
                  "AuthSession",
                  "LoginRequest",
                  "ActivateInviteRequest",
              ],
              "credits": [
                  "CreditRule",
                  "CreditSummary",
                  "CreditTransactionType",
                  "CreditTransaction",
                  "CreditTransactionPage",
              ],
              "health": [
                  "HealthModelSummary",
                  "HealthPlanningCapabilities",
                  "HealthRuntimeSummary",
                  "HealthResponse",
              ],
          }

          def declaration_span(lines: list[str], name: str) -> tuple[int, int]:
              pattern = re.compile(rf"^export\s+(type|interface)\s+{re.escape(name)}\b")
              matches: list[tuple[int, str]] = []
              for line_index, line in enumerate(lines):
                  match = pattern.match(line)
                  if match:
                      matches.append((line_index, match.group(1)))

              if len(matches) != 1:
                  raise RuntimeError(f"Expected one declaration for {name}, found {len(matches)}")

              start, kind = matches[0]
              if kind == "interface":
                  depth = 0
                  seen_open = False
                  end = None
                  for line_index in range(start, len(lines)):
                      for character in lines[line_index]:
                          if character == "{":
                              depth += 1
                              seen_open = True
                          elif character == "}":
                              depth -= 1
                      if seen_open and depth == 0:
                          end = line_index + 1
                          break
                  if end is None:
                      raise RuntimeError(f"Unclosed interface declaration for {name}")
              else:
                  end = None
                  for line_index in range(start, len(lines)):
                      if ";" in lines[line_index]:
                          end = line_index + 1
                          break
                  if end is None:
                      raise RuntimeError(f"Unclosed type declaration for {name}")

              remove_start = start
              cursor = start - 1
              while cursor >= 0:
                  while cursor >= 0 and not lines[cursor].strip():
                      cursor -= 1
                  if cursor < 0 or not lines[cursor].strip().endswith("*/"):
                      break

                  while cursor >= 0 and not lines[cursor].lstrip().startswith("/**"):
                      cursor -= 1
                  if cursor < 0:
                      raise RuntimeError(f"Malformed JSDoc before {name}")

                  remove_start = cursor
                  cursor -= 1

              return remove_start, end

          source = INDEX_PATH.read_text(encoding="utf-8")
          lines = source.splitlines(keepends=True)
          spans: list[tuple[int, int, str]] = []

          for names in groups.values():
              for name in names:
                  start, end = declaration_span(lines, name)
                  spans.append((start, end, name))

          ordered = sorted(spans)
          for previous, current in zip(ordered, ordered[1:]):
              if previous[1] > current[0]:
                  raise RuntimeError(f"Overlapping declarations: {previous[2]} and {current[2]}")

          for start, end, _name in sorted(spans, reverse=True):
              del lines[start:end]

          compatibility_header = '''import type { InviteStatus, UserRole, UserStatus } from "./auth";

          export type {
            ActivateInviteRequest,
            AuthenticatedUser,
            AuthSession,
            InviteStatus,
            LoginRequest,
            UserRole,
            UserStatus,
          } from "./auth";
          export type {
            CreditRule,
            CreditSummary,
            CreditTransaction,
            CreditTransactionPage,
            CreditTransactionType,
          } from "./credits";
          export type {
            HealthModelSummary,
            HealthPlanningCapabilities,
            HealthResponse,
            HealthRuntimeSummary,
          } from "./health";
          '''

          remaining = "".join(lines).lstrip()
          remaining = re.sub(r"\n{3,}", "\n\n", remaining)
          INDEX_PATH.write_text(
              compatibility_header.strip() + "\n\n" + remaining.rstrip() + "\n",
              encoding="utf-8",
          )

          (TYPES_DIR / "auth.ts").write_text(
              '''/** Authentication and account contracts. */
          export type UserRole = "ADMIN" | "USER";

          export type UserStatus = "ACTIVE" | "DISABLED";

          export type InviteStatus = "UNUSED" | "USED" | "REVOKED" | "EXPIRED";

          export interface AuthenticatedUser {
            id: number;
            username: string;
            role: UserRole;
          }

          export interface AuthSession {
            authenticated: boolean;
            user: AuthenticatedUser | null;
          }

          export interface LoginRequest {
            username: string;
            password: string;
          }

          export interface ActivateInviteRequest {
            code: string;
            username: string;
            password: string;
          }
          ''',
              encoding="utf-8",
          )

          (TYPES_DIR / "credits.ts").write_text(
              '''/** User credit and transaction contracts. */
          export interface CreditRule {
            featureCode: string;
            displayName: string;
            cost: number;
            updatedAt?: string | null;
          }

          export interface CreditSummary {
            exempt: boolean;
            balance: number | null;
            totalConsumed?: number;
            totalAdjusted?: number;
            rules: CreditRule[];
          }

          export type CreditTransactionType = "ADJUST" | "CONSUME" | "USAGE" | "REFUND" | string;

          export interface CreditTransaction {
            transactionId: string;
            userId: number;
            featureCode?: string | null;
            transactionType: CreditTransactionType;
            amountDelta: number;
            balanceBefore: number;
            balanceAfter: number;
            relatedRunId?: string | null;
            relatedTaskId?: string | null;
            relatedWorkflowId?: string | null;
            reason?: string | null;
            createdAt: string;
          }

          export interface CreditTransactionPage {
            items: CreditTransaction[];
            total: number;
            offset: number;
            limit: number;
          }
          ''',
              encoding="utf-8",
          )

          (TYPES_DIR / "health.ts").write_text(
              '''/** Health-check and runtime diagnostic contracts. */
          export interface HealthModelSummary {
            provider: string | null;
            primary_model?: string | null;
            primaryModel?: string | null;
            text_analysis_provider?: string | null;
            textAnalysisProvider?: string | null;
            text_analysis_model?: string | null;
            textAnalysisModel?: string | null;
            endpoint_host?: string;
            endpointHost?: string | null;
            api_key_present?: boolean;
            apiKeyPresent?: boolean;
            ready: boolean;
            temperature: number;
            max_tokens?: number;
            maxTokens?: number;
            config_errors?: string[];
            configErrors?: string[];
          }

          export interface HealthPlanningCapabilities {
            timed_transcript_supported?: boolean;
            timedTranscriptSupported?: boolean;
            transcript_semantic_planning?: boolean;
            transcriptSemanticPlanning?: boolean;
            visual_content_analysis?: boolean;
            visualContentAnalysis?: boolean;
            visual_event_reasoning?: boolean;
            visualEventReasoning?: boolean;
            subtitle_visual_fusion?: boolean;
            subtitleVisualFusion?: boolean;
            audio_peak_signal?: boolean;
            audioPeakSignal?: boolean;
            scene_boundary_signal?: boolean;
            sceneBoundarySignal?: boolean;
            fusion_timeline_planning?: boolean;
            fusionTimelinePlanning?: boolean;
            fallback_heuristic_enabled?: boolean;
            fallbackHeuristicEnabled?: boolean;
          }

          export interface HealthRuntimeSummary {
            name: string;
            env: string;
            execution_mode?: string;
            executionMode?: string;
            database_url?: string;
            databaseUrl?: string;
            model_provider?: string | null;
            modelProvider?: string | null;
            storage_root?: string;
            storageRoot?: string;
            model: HealthModelSummary;
            planning_capabilities?: HealthPlanningCapabilities;
            planningCapabilities?: HealthPlanningCapabilities;
          }

          export interface HealthResponse {
            ok: boolean;
            runtime: HealthRuntimeSummary;
          }
          ''',
              encoding="utf-8",
          )

          (TYPES_DIR / "compatibility.typecheck.ts").write_text(
              '''import type {
            AuthSession as BarrelAuthSession,
            CreditSummary as BarrelCreditSummary,
            HealthResponse as BarrelHealthResponse,
          } from "./index";
          import type { AuthSession } from "./auth";
          import type { CreditSummary } from "./credits";
          import type { HealthResponse } from "./health";

          type Equal<Left, Right> =
            (<Value>() => Value extends Left ? 1 : 2) extends
            (<Value>() => Value extends Right ? 1 : 2)
              ? true
              : false;
          type Assert<Value extends true> = Value;

          export type AuthCompatibility = Assert<Equal<AuthSession, BarrelAuthSession>>;
          export type CreditCompatibility = Assert<Equal<CreditSummary, BarrelCreditSummary>>;
          export type HealthCompatibility = Assert<Equal<HealthResponse, BarrelHealthResponse>>;
          ''',
              encoding="utf-8",
          )

          (TYPES_DIR / "README.md").write_text(
              '''# Frontend contract boundaries

          `types/index.ts` remains the compatibility barrel for existing imports. New code should import contracts from a domain entry point instead:

          - `@/types/auth`
          - `@/types/generation`
          - `@/types/tasks`
          - `@/types/workflows`
          - `@/types/materials`
          - `@/types/uploads`
          - `@/types/public-shares`
          - `@/types/credits`
          - `@/types/health`
          - `@/types/admin`

          `auth.ts`, `credits.ts`, and `health.ts` now own their definitions. The compatibility barrel imports the account types it needs internally and re-exports all extracted contracts, so existing `@/types` consumers continue to compile.

          The remaining domain files are migration facades over the compatibility barrel. Move their definitions incrementally, keeping each change reviewable and protected by typecheck coverage.

          Place a contract in the narrowest domain that owns it. Cross-domain modules should use multiple explicit type imports rather than returning to the compatibility barrel.
          ''',
              encoding="utf-8",
          )

          plan_path = Path("docs/refactoring-plan.md")
          plan = plan_path.read_text(encoding="utf-8")
          old = "- [ ] Move the underlying definitions out of `src/types/index.ts` domain by domain."
          new = (
              "- [x] Move authentication, credit, and health definitions out of `src/types/index.ts`.\n"
              "- [ ] Move the remaining definitions out of `src/types/index.ts` domain by domain."
          )
          if old not in plan:
              raise RuntimeError("Refactoring plan marker was not found")
          plan_path.write_text(plan.replace(old, new), encoding="utf-8")
          PY

      - name: Verify extraction shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("frontends/web/src/types/index.ts").read_text(encoding="utf-8")
          for name in (
              "UserRole",
              "AuthSession",
              "CreditSummary",
              "CreditTransaction",
              "HealthResponse",
              "HealthRuntimeSummary",
          ):
              if f"export interface {name}" in index or f"export type {name} =" in index:
                  raise SystemExit(f"{name} is still declared in the compatibility barrel")
          PY

      - name: Commit extracted contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontends/web/src/types docs/refactoring-plan.md
          git diff --cached --check
          git commit -m "refactor(types): extract core contract definitions"
          git push origin HEAD:refactor/extract-core-contracts
