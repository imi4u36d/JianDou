name: Deploy Main

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          script: |
            set -euo pipefail

            PROJECT_DIR="${{ secrets.DEPLOY_PROJECT_DIR }}"
            BRANCH="main"
            COMPOSE_FILE="docker-compose.yml"
            TARGET="all"

            if [ -z "$PROJECT_DIR" ]; then
              echo "Missing secret: DEPLOY_PROJECT_DIR"
              exit 1
            fi

            cd "$PROJECT_DIR"

            # Always use latest code from origin.
            git fetch --all --prune
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ "$TARGET" = "all" ]; then
              docker compose -f "$COMPOSE_FILE" pull app frontend mysql redis
              docker compose -f "$COMPOSE_FILE" up -d mysql redis
              docker compose -f "$COMPOSE_FILE" up -d --build app frontend
            elif [ "$TARGET" = "app" ]; then
              docker compose -f "$COMPOSE_FILE" pull app
              docker compose -f "$COMPOSE_FILE" up -d --build app
            elif [ "$TARGET" = "frontend" ]; then
              docker compose -f "$COMPOSE_FILE" pull frontend
              docker compose -f "$COMPOSE_FILE" up -d --build frontend
            elif [ "$TARGET" = "mysql" ]; then
              docker compose -f "$COMPOSE_FILE" pull mysql
              docker compose -f "$COMPOSE_FILE" up -d mysql
            elif [ "$TARGET" = "redis" ]; then
              docker compose -f "$COMPOSE_FILE" pull redis
              docker compose -f "$COMPOSE_FILE" up -d redis
            else
              echo "Unknown deploy target: $TARGET"
              exit 1
            fi

            # Reclaim unused images after rebuild.
            docker image prune -f
