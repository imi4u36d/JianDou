name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint backend
        run: uv run ruff check backend tests migrations

      - name: Run backend tests
        run: uv run pytest

      - name: Verify database migrations
        run: |
          TMP_DB=$(mktemp -t jiandou.XXXXXX.db)
          JIANDOU_DATABASE_URL="sqlite+aiosqlite:///$TMP_DB" uv run alembic upgrade head
          rm -f "$TMP_DB"

      - name: Export OpenAPI schema
        run: uv run jiandou openapi --output docs/openapi.json

      - name: Build Python package
        run: uv build

      - name: Verify Python package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("jiandou-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              if any(name.startswith("tests/") for name in names):
                  raise SystemExit("Wheel must not include tests/")
              if not any(name.endswith(".dist-info/licenses/License") for name in names):
                  raise SystemExit("Wheel must include the project license")
          PY

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck packages
        run: npm run packages:typecheck

      - name: Typecheck web
        run: npm run web:typecheck

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t jiandou:ci .
