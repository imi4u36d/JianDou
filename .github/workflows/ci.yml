name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: jiandou_test
          MYSQL_USER: jiandou
          MYSQL_PASSWORD: jiandou
          MYSQL_ROOT_PASSWORD: jiandou-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ujiandou -pjiandou"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      JIANDOU_DATABASE_URL: mysql+asyncmy://jiandou:jiandou@127.0.0.1:3306/jiandou_test?charset=utf8mb4
      JIANDOU_TEST_DATABASE_URL: mysql+asyncmy://jiandou:jiandou@127.0.0.1:3306/jiandou_test?charset=utf8mb4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint backend
        run: uv run ruff check backend tests migrations

      - name: Run backend tests
        run: uv run pytest

      - name: Verify database migrations
        run: uv run alembic upgrade head

      - name: Export OpenAPI schema
        run: uv run jiandou openapi --output docs/openapi.json

      - name: Build Python package
        run: uv build

      - name: Verify Python package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("jiandou-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              if any(name.startswith("tests/") for name in names):
                  raise SystemExit("Wheel must not include tests/")
              if not any(name.endswith(".dist-info/licenses/License") for name in names):
                  raise SystemExit("Wheel must include the project license")
          PY

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run web:lint

      - name: Typecheck packages
        run: npm run packages:typecheck

      - name: Typecheck web
        run: npm run web:typecheck

      - name: Run frontend tests
        run: npm run web:test

      - name: Build web
        run: npm run web:build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t jiandou:ci .
